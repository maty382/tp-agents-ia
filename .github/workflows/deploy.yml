name: Deploy
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version a livrer
        required: true
        default: "1.0.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Compiler et tester
        run: mvn -B package
      - name: Construire l image Docker
        run: docker build -t tp-agents-ia:${{ inputs.version }} .
      - name: Lancer l application (simulation du deploiement)
        run: docker run --rm tp-agents-ia:${{ inputs.version }}
